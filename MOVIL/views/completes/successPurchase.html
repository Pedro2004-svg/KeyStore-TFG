<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#4CAF50',
                        'brand-dark': '#45a049',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-blue-500">
<div id="header"></div>
<div class="pt-36 md:pt-[70px] max-w-2xl mx-auto my-6 md:my-16 px-3 md:px-5 flex-1">
    <div class="bg-white rounded-xl p-5 md:p-10 shadow-lg text-center">

        <div class="text-5xl md:text-7xl mb-4 md:mb-5">🎉</div>
        <h2 class="text-green-500 text-2xl md:text-3xl font-bold mb-2">¡Compra realizada con éxito!</h2>
        <p class="text-gray-500 text-sm md:text-base mb-6 md:mb-8">Gracias por tu compra. Aquí tienes tus claves de activación:</p>

        <!-- Aviso -->
        <div class="bg-yellow-50 border border-yellow-300 rounded-lg px-3 md:px-4 py-3 text-yellow-800 text-xs md:text-sm mb-4 md:mb-5 text-left">
            ⚠️ <strong>Guarda tus claves</strong> — no podrás volver a consultarlas desde aquí.
        </div>

        <!-- Claves -->
        <div class="bg-gray-50 rounded-lg p-3 md:p-5 my-4 md:my-5 text-left">
            <h3 class="text-gray-800 font-semibold text-base md:text-lg mb-3 md:mb-4">🔑 Tus claves de activación</h3>
            <div id="keysContainer">
                <div class="text-center text-gray-500 py-5">Cargando tus claves...</div>
            </div>
        </div>

        <button onclick="window.location.href='/'"
            class="w-full md:w-auto bg-green-500 hover:bg-green-600 text-white border-none py-3 md:py-3.5 px-8 rounded-lg text-base font-semibold cursor-pointer transition-colors mt-2">
            🏠 Volver al catálogo
        </button>
    </div>
</div>

<script type="module" src="/controllers/successPurchase.js"></script>
<script type="module" src="/views/partials/partials.js"></script>

<div id="footer"></div>
