<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#4CAF50',
                        'brand-dark': '#45a049',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-blue-500">
<div id="header"></div>
<div class="pt-36 md:pt-[70px] max-w-[1360px] mx-auto mb-10 px-3 md:px-5 md:my-7
            flex flex-col md:grid md:grid-cols-[minmax(0,1fr)_320px] gap-4 md:gap-6 items-start">

    <!-- Columna principal: cesta -->
    <div class="bg-white shadow-sm order-2 md:order-1">
        <div class="px-4 md:px-6 pt-5 md:pt-7 pb-4 md:pb-6">
            <h2 class="text-3xl md:text-5xl font-medium text-black">Cesta</h2>
        </div>
        <div id="carritoContainer" class="flex flex-col bg-white">
            <div class="text-center text-xl md:text-2xl py-8 md:py-10 text-gray-500 border border-gray-200 m-3 md:m-4">
                Cargando carrito...
            </div>
        </div>
    </div>

    <!-- Columna lateral: resumen -->
    <div class="bg-white shadow-sm md:sticky md:top-24 flex flex-col gap-4 p-4 md:p-6 order-1 md:order-2
                after:content-['Revisa_tu_pedido_antes_de_continuar'] after:block after:pt-4 after:border-t after:border-gray-200 after:text-gray-500 after:text-sm after:leading-snug">
        <div class="flex flex-col gap-1 md:gap-2 text-black">
            <span id="cartCount" class="text-sm md:text-base text-gray-500 font-medium">0 items</span>
            <span id="cartTotal" class="text-2xl md:text-3xl font-bold leading-tight">Total: $0.00</span>
        </div>
        <button id="buyBtn"
            onclick="realizarCompra()"
            disabled
            class="w-full py-2.5 md:py-3 px-5 rounded-full bg-yellow-300 hover:bg-yellow-400 text-black text-base md:text-lg font-semibold shadow-sm disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed transition-colors">
            💳 Finalizar Compra
        </button>
    </div>
</div>
    <script type="module" src="/views/partials/partials.js"></script>
    <script type="module" src="/controllers/cart.js"></script>
<div id="footer"></div>
