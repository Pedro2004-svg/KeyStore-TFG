<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#4CAF50',
                        'brand-dark': '#45a049',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-blue-500">
<div id="header"></div>
<div class="pt-32 md:pt-[70px] max-w-[1400px] mx-auto my-8 px-5 flex-1">
    <h2 class="text-center mb-8 text-3xl font-bold text-black">Catálogo de Juegos</h2>

    <!-- Top 10 Favoritos -->
<div class="bg-white p-4 md:p-5 rounded-lg mb-6 md:mb-8 shadow-sm">
    <h3 class="text-lg md:text-xl font-semibold text-gray-800 mb-4">❤️ Top 10 Juegos Más Favoritos</h3>
    
    <div class="relative">
        <!-- Botón izquierda -->
        <button id="prevBtn" onclick="moverCarrusel(-1)"
            class="absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white shadow-md rounded-full w-9 h-9 flex items-center justify-center hover:bg-gray-100 border border-gray-200 cursor-pointer -ml-3">
            ‹
        </button>

        <!-- Carrusel -->
        <div class="overflow-hidden mx-4">
            <div id="mostFavoritedContainer" class="flex gap-4 transition-transform duration-300 ease-in-out">
                <div class="min-w-[200px] text-center text-gray-600">Cargando...</div>
            </div>
        </div>

        <!-- Botón derecha -->
        <button id="nextBtn" onclick="moverCarrusel(1)"
            class="absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white shadow-md rounded-full w-9 h-9 flex items-center justify-center hover:bg-gray-100 border border-gray-200 cursor-pointer -mr-3">
            ›
        </button>
    </div>
</div>

    <!-- Búsqueda Avanzada -->
    <div class="bg-white p-5 rounded-lg mb-8 shadow-sm">
        <h3 class="text-xl font-semibold text-gray-800 mb-4">🔍 Búsqueda Avanzada</h3>
        <form id="searchForm" class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] gap-4 mb-4">
            <div class="flex flex-col">
                <label for="searchTerm" class="mb-1 font-bold text-gray-700">Nombre del Juego</label>
                <input type="text" id="searchTerm" placeholder="Ej: Mario, Zelda..."
                    class="px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex flex-col">
                <label for="minPrice" class="mb-1 font-bold text-gray-700">Precio Mínimo (€)</label>
                <input type="number" id="minPrice" min="0" step="0.01" placeholder="0"
                    class="px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex flex-col">
                <label for="maxPrice" class="mb-1 font-bold text-gray-700">Precio Máximo (€)</label>
                <input type="number" id="maxPrice" min="0" step="0.01" placeholder="100"
                    class="px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex flex-col">
                <label for="sortBy" class="mb-1 font-bold text-gray-700">Ordenar por</label>
                <select id="sortBy"
                    class="px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-indigo-500">
                    <option value="name">Nombre</option>
                    <option value="price_asc">Precio (menor a mayor)</option>
                    <option value="price_desc">Precio (mayor a menor)</option>
                    <option value="popular">Más vendidos</option>
                    <option value="favorites">Más favoritos</option>
                </select>
            </div>
            <div class="col-span-full flex gap-3">
                <button type="submit"
                    class="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-3 rounded text-base cursor-pointer border-none">
                    Buscar
                </button>
                <button type="button" onclick="clearSearch()"
                    class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded text-base cursor-pointer border-none">
                    Limpiar
                </button>
            </div>
        </form>
        <div id="resultsInfo" class="hidden px-3 py-2 bg-gray-100 rounded text-center my-4 text-sm"></div>
    </div>

    <!-- Categorías -->
    <div class="bg-white p-5 rounded-lg mb-8 shadow-sm">
        <h3 id="catalogo" class="text-xl font-semibold text-gray-800 mb-4">🎮 Categorías</h3>

        <div id="categoryTabs" class="flex flex-wrap gap-3 mb-5">
            <button onclick="loadCategory('Todos', this)"
                class="cat-btn bg-gray-100 text-gray-700 border-2 border-gray-300 px-5 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all">
                🎮 Todos
            </button>
            <button onclick="loadCategory('Gratis', this)"
                class="cat-btn bg-indigo-500 text-white border-2 border-indigo-500 px-5 py-2 rounded-full text-sm font-bold cursor-pointer shadow-md transition-all">
                🆓 Gratis
            </button>
            <button onclick="loadCategory('Acción', this)"
                class="cat-btn bg-gray-100 text-gray-700 border-2 border-gray-300 px-5 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all">
                ⚔️ Acción
            </button>
            <button onclick="loadCategory('Aventura', this)"
                class="cat-btn bg-gray-100 text-gray-700 border-2 border-gray-300 px-5 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all">
                🗺️ Aventura
            </button>
            <button onclick="loadCategory('RPG', this)"
                class="cat-btn bg-gray-100 text-gray-700 border-2 border-gray-300 px-5 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all">
                🧙 RPG
            </button>
            <button onclick="loadCategory('Estrategia', this)"
                class="cat-btn bg-gray-100 text-gray-700 border-2 border-gray-300 px-5 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all">
                ♟️ Estrategia
            </button>
            <button onclick="loadCategory('Deportes', this)"
                class="cat-btn bg-gray-100 text-gray-700 border-2 border-gray-300 px-5 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all">
                ⚽ Deportes
            </button>
            <button onclick="loadCategory('Simulación', this)"
                class="cat-btn bg-gray-100 text-gray-700 border-2 border-gray-300 px-5 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all">
                🎮 Simulación
            </button>
            <button onclick="loadCategory('Indie', this)"
                class="cat-btn bg-gray-100 text-gray-700 border-2 border-gray-300 px-5 py-2 rounded-full text-sm font-bold cursor-pointer hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all">
                🎨 Indie
            </button>
        </div>

        <div id="categoryContainer" class="grid grid-cols-3 md:grid-cols-3 lg:grid-cols-[repeat(auto-fill,minmax(250px,1fr))] gap-2 md:gap-5">
            <div class="col-span-full text-center text-xl mt-12 text-gray-600">Selecciona una categoría...</div>
        </div>
    </div>
</div>

<script type="module" src="controllers/catalog.js"></script>
<script type="module" src="/views/partials/partials.js"></script>
<div id="footer"></div>
